o name: Meeting lifecycle cleanup

on:
  schedule:
    # Every hour (UTC). Adjust if needed.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  call-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke meeting lifecycle cron endpoint
        env:
          CRON_URL: ${{ secrets.MEETING_LIFECYCLE_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ]; then
            echo "Missing secret: MEETING_LIFECYCLE_CRON_URL" >&2
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing secret: CRON_SECRET" >&2
            exit 1
          fi
          curl -fsS "$CRON_URL" -H "x-cron-secret: $CRON_SECRET"

